# Scaled probe study. Arm B only.
#
# 252 games x 2 rollouts x 4 checkpoints = ~2,000 checkpoints, the low end of the
# 2-3k target. Everything else is held fixed from the validation run on purpose:
# same ALFWorld setup, same Qwen2.5-7B, same expert intervention, same T=0.3,
# same admissible-command scaffold. The only variable under test is whether the
# pilot's activation result survives more data.
#
# Arm A is not re-run. It is the paper-faithful replication and is already
# settled at n=332; probes train on Arm B, whose Q(s,intervene) averages five
# expert seeds rather than taking one draw from a stochastic expert. Running Arm A
# again would add ~21% wall-clock and answer nothing new.

# Gate B -- validation tier. The last gate before we STOP and report.
#
# ~42 games (7 per task type) x 2 rollouts x 4 checkpoints ~= 336 checkpoints per
# arm. Arm A runs 1 suffix per action (realized U); Arm B runs 5 (estimated Qhat).
# This is the tier that answers the two acceptance questions:
#   Q1 (replication) -- did Arm A reproduce the same-risk/different-control effect?
#   Q2 (extension)   -- are Arm B's Qhat targets stable enough for Stage-2 probes?
run_id: scale
data_root: data/runs

alfworld:
  split: train
  data_dir: /data/alfworld
  games_per_task_type: 42         # 42 x 6 task types = 252 games
  max_episode_steps: 50
  expert_max_steps: 1000

model:
  id: Qwen/Qwen2.5-7B-Instruct
  revision: null
  template: hf                    # authoritative; source of prompt_token_ids for V10

serving:
  kind: openai_compatible
  base_url: http://localhost:8000
  model: Qwen/Qwen2.5-7B-Instruct
  api_key: EMPTY

# Admissible commands are SHOWN. Hiding them (the ReAct convention, and our
# original default) produced 0% base success: the agent navigates correctly but
# invents object-interaction syntax. Showing them took Arm A from 0/6 to 2/6 and
# the admissible rate from 13.7% to 46.1%, while preserving the paper-stated
# 24-token action budget -- which act->react would have broken.
scaffold:
  mode: act
  n_shots: 2
  show_admissible_commands: true
  max_action_tokens: 24
  max_confidence_tokens: 8

elicit_confidence: true

arms:
  - name: A_replication
    temperature: 0.0
    n_replicates: 1
  - name: B_montecarlo
    # 0.3, not the 0.7 the plan guessed. Measured: at 0.7 the agent scored 0/6 --
    # one bad sample poisons a 50-step trajectory. Of the candidates that stayed
    # in band, 0.3 was the only one with non-zero outcome variance across seeds
    # (2/12 vs 0/12 at 0.5), which is the property Qhat actually needs.
    temperature: 0.3
    n_replicates: 5

rollouts:
  per_game: 2

branching:
  k_checkpoints: 4

splits:
  # Enlarged interactive suite from App. B.3. These label a subset for replication
  # fidelity; the section-7 analysis uses every usable checkpoint regardless, so
  # nothing is wasted -- the labels exist for Stage 2.
  paper_counts: [20, 10, 20]
  task_level_fractions: [0.6, 0.2, 0.2]
  seed: 0
